# Creates /run/cachyos-htpc, owned by the target user, on every boot --
# before any htpc-*.service unit starts (systemd-tmpfiles-setup.service
# runs as part of sysinit.target, well before graphical.target). This is
# where the NVIDIA-only Steam Gaming Mode / KDE Desktop merged-session
# environment file lives (`HTPC_STEAM_BIGPICTURE=0|1`). See lib/gpu.sh for
# why /run rather than the user's home directory or XDG_RUNTIME_DIR, and
# htpc-switch / bin/htpc-steam-bigpicture-boot-marker /
# bin/htpc-steam-autostart for how it's actually used.
#
# __HTPC_USER__ is substituted at install time by
# htpc_steam_bigpicture_runtime_dir_install (lib/gpu.sh).
d /run/cachyos-htpc 0755 __HTPC_USER__ __HTPC_USER__ -
